<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados | Oficiar</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light pb-5 pb-md-0">

    <nav class="navbar navbar-dark brand-color sticky-top shadow-sm py-3">
        <div class="container d-flex align-items-center">
            <a href="../index.html" class="text-white text-decoration-none fs-4 me-3 transition-hover" aria-label="Volver al inicio"><i class="bi bi-arrow-left"></i></a>
            <span class="text-white fw-bold fs-5 mb-0" id="titulo-categoria">Buscando profesionales...</span>
        </div>
    </nav>

    <main class="container py-4 main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0" id="contador-resultados">Cargando...</p>
            <button class="btn btn-outline-secondary btn-sm rounded-pill position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFiltro" aria-controls="offcanvasFiltro">
                <i class="bi bi-filter me-1"></i> Filtrar
                <span class="filtro-activo-dot d-none" id="filtro-activo-dot"></span>
            </button>
        </div>

        <div class="row g-3" id="contenedor-lista"></div>
    </main>

    <!-- Panel de filtros: bottom sheet en mobile, panel centrado en desktop -->
    <div class="offcanvas offcanvas-bottom filtro-offcanvas" tabindex="-1" id="offcanvasFiltro" aria-labelledby="offcanvasFiltroLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold text-dark" id="offcanvasFiltroLabel">Filtrar y ordenar</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
            <h6 class="fw-bold text-dark mb-3">Ordenar por</h6>
            <div class="list-group mb-4">
                <label class="list-group-item d-flex align-items-center gap-2">
                    <input class="form-check-input me-1" type="radio" name="orden" value="relevancia" checked>
                    Recomendados
                </label>
                <label class="list-group-item d-flex align-items-center gap-2">
                    <input class="form-check-input me-1" type="radio" name="orden" value="calificacion">
                    Mejor calificados
                </label>
                <label class="list-group-item d-flex align-items-center gap-2">
                    <input class="form-check-input me-1" type="radio" name="orden" value="experiencia">
                    Más experiencia
                </label>
            </div>

            <h6 class="fw-bold text-dark mb-3">Calificación mínima</h6>
            <div class="list-group mb-4">
                <label class="list-group-item d-flex align-items-center gap-2">
                    <input class="form-check-input me-1" type="radio" name="calificacion-min" value="0" checked>
                    Todas
                </label>
                <label class="list-group-item d-flex align-items-center gap-2">
                    <input class="form-check-input me-1" type="radio" name="calificacion-min" value="4.5">
                    4.5 <i class="bi bi-star-fill text-warning ms-1"></i> o más
                </label>
                <label class="list-group-item d-flex align-items-center gap-2">
                    <input class="form-check-input me-1" type="radio" name="calificacion-min" value="4.8">
                    4.8 <i class="bi bi-star-fill text-warning ms-1"></i> o más
                </label>
            </div>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary flex-grow-1 fw-bold" id="btn-limpiar-filtros">Limpiar</button>
                <button type="button" class="btn cta-btn text-white flex-grow-1 fw-bold" id="btn-ver-resultados" data-bs-dismiss="offcanvas">Ver resultados</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/lista.js"></script>
</body>
</html>
